<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/app.js"></script>
    <title>Cat-Dog-Toe</title>
</head>

<body>
    <h1>Cat-Dog-Toe</h1>

    <!-- Audio Tags -->
    <audio src="./assets/cat.wav" id="catSound"></audio>
    <audio src="./assets/dog.mp3" id="dogSound"></audio>
    <audio src="./assets/backSound.mp3" loop id="backSound"></audio>
    <audio src="./assets/success.mp3" id="success"></audio>
    <audio src="./assets/tie.mp3" id="tie"></audio>

    <div class="game">
        <div class="sideColumn">
            <h2 id="message">Message</h2>
        </div>
        <section class="board">
            <div class="sqr" id="0"></div>
            <div class="sqr" id="1"></div>
            <div class="sqr" id="2"></div>
            <div class="sqr" id="3"></div>
            <div class="sqr" id="4"></div>
            <div class="sqr" id="5"></div>
            <div class="sqr" id="6"></div>
            <div class="sqr" id="7"></div>
            <div class="sqr" id="8"></div>
        </section>

        <!-- Reset Button -->
        <button id="reset">🔄️<br /><span class="label">Reset</span></button>

    </div>

</body>

</html>
